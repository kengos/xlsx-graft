[package]
name = "xlsx-graft-write"
description = "xlsx-graft write: edits an xlsx package, rewriting, adding and removing parts while copying every other entry as it is, and writes a zip deterministically, spilling large content to scratch storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crc32fast = { workspace = true }
miniz_oxide = { workspace = true }
thiserror = { workspace = true }
# Every problem in an entry copied from a workbook is a Diagnostic.
xlsx-graft-diagnostics = { workspace = true }
# The zip an entry is copied from, and the package that says which parts
# there are.
xlsx-graft-package = { workspace = true }
# Holds new content deflated until it is written.
xlsx-graft-spool = { workspace = true }
# Reads and writes the XML parts the edit changes itself: the content types
# stream and the Relationships parts.
xlsx-graft-xml = { workspace = true }

# The temporary file `write_file_atomically` writes to before it renames it,
# not built for WebAssembly (the crate root).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
