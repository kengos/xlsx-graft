[package]
name = "xlsx-graft-host"
description = "xlsx-graft host: what the CLI, the C ABI and the MCP server share to verify and to view a workbook (its tree and the cells of a sheet), the policy, the rules and the options read from JSON and the result written as JSON and as text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The policy, the rules and the result are JSON.
serde = { workspace = true }
serde_json = { workspace = true }
# The error of a request that is not an object of `policy` and `rules`.
thiserror = { workspace = true }
# Every fault of the policy and the rules is a Diagnostic, and so is every
# problem of the workbook, written as the result's JSON.
xlsx-graft-diagnostics = { workspace = true }
# The package a tree of the workbook is read from: its parts and the
# relationships between them.
xlsx-graft-package = { workspace = true }
# The limits a workbook's cells are read under, which `read_limits` makes, and
# the sheet's rows `describe_sheet` reads.
xlsx-graft-read = { workspace = true }
# The temporary files the shared strings table moves to when it is large: the
# spool factory `describe_sheet` passes to `Book::open`.
xlsx-graft-spool = { workspace = true }
# The check itself, and the limits and rules it runs under.
xlsx-graft-verify = { workspace = true }

[dev-dependencies]
# A directory of its own for the setting file a test writes.
tempfile = { workspace = true }

[lints]
workspace = true
