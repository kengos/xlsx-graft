[workspace]
resolver = "3"
members = [
    "capi",
    "cli",
    "compat",
    "core",
    "diagnostics",
    "fixtures-gen",
    "formula",
    "mcp",
    "napi",
    "package",
    "read",
    "reference",
    "spool",
    "verify",
    "xml",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause"
# crates.io takes the CLI, the MCP server and the engine crates they build on.
# The crates that are not published (capi, napi, fixtures-gen) say
# `publish = false` in their own Cargo.toml.
repository = "https://github.com/kengos/xlsx-graft"

# Every dependency is declared once here; a member names it with
# `{ workspace = true }`.
[workspace.dependencies]
# Each xlsx-graft crate names its version beside its path: `cargo package`
# refuses a path dependency with none. The version is the workspace's, and
# `make version:check` fails when they differ.
xlsx-graft-core = { path = "core", version = "0.0.0" }
# The closed diagnostic codes and their JSON shape (engine/diagnostics).
xlsx-graft-diagnostics = { path = "diagnostics", version = "0.0.0" }
# The guarded reader for a package's untrusted XML (engine/xml).
xlsx-graft-xml = { path = "xml", version = "0.0.0" }
# The facts a formula string states, read by its lexer (engine/formula).
xlsx-graft-formula = { path = "formula", version = "0.0.0" }
# The zip container of an untrusted package, read under limits (engine/package).
xlsx-graft-package = { path = "package", version = "0.0.0" }
# Scratch storage that spills to a temporary file (engine/spool).
xlsx-graft-spool = { path = "spool", version = "0.0.0" }
# A workbook's shared strings, read on the package (engine/read).
xlsx-graft-read = { path = "read", version = "0.0.0" }
# The reference pages compiled into the binary (engine/reference).
xlsx-graft-reference = { path = "reference", version = "0.0.0" }
# Which application version has each function and feature (engine/compat).
xlsx-graft-compat = { path = "compat", version = "0.0.0" }
# Refuses what an untrusted workbook may not carry (engine/verify).
xlsx-graft-verify = { path = "verify", version = "0.0.0" }
# The C ABI host, linked as an rlib by the Node.js addon (engine/napi).
xlsx-graft-capi = { path = "capi", version = "0.0.0" }
# The CLI's argument parser. derive keeps each flag's help beside its field,
# and a `global` flag (`--format`) reaches every subcommand added later. The
# defaults minus `color`: terminal colouring alone pulls in ten crates
# (anstream, the Windows console shims), and the help and errors read the
# same without it.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# The CLI's `--format json`: every command's output derives Serialize, so the
# JSON shape is the type's shape rather than hand-built strings. serde_json
# brings itoa and zmij (integer and float formatting) and memchr. The MCP
# server reads and writes its JSON-RPC messages with it too.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The XML parser under engine/xml. No features: `encoding` would pull in
# encoding_rs for every legacy encoding, and package XML may only be UTF-8 or
# UTF-16 (ECMA-376-2:2021 §6.2.5), which the xml crate decodes with std. It
# never expands entities or reads a DTD; it reports a DOCTYPE as an event,
# which the xml crate refuses. Its only dependency is memchr.
quick-xml = { version = "0.42", default-features = false }
# Inflates a package's deflated zip entries (engine/package). Pure Rust,
# `forbid(unsafe_code)`, its only dependency adler2. Its streaming `inflate`
# writes into the caller's buffer, so the caller counts every byte it
# produces and stops at a limit instead of trusting the declared size. Its
# default `with-alloc` feature brings the boxed state and the compressor
# the tests build deflated entries with.
miniz_oxide = "0.9"
# The CRC-32 a zip entry's inflated bytes are checked against. Its only
# dependency is cfg-if; the `std` default picks the SIMD path at run time.
crc32fast = "1"
# The temporary files engine/spool spills to: an unnamed file in a
# directory, removed by the OS when closed, however the process ends. Linux
# opens it with O_TMPFILE where the file system can, other Unixes unlink it
# at once, and Windows deletes it on close, which std alone cannot ask for.
# It brings fastrand (the fallback file names) and once_cell, and per
# platform rustix with errno and linux-raw-sys (Unix) or windows-sys
# (Windows). No default features: `getrandom` only seeds those names from
# the OS, and a name taken is retried, since every file is created
# exclusively.
tempfile = { version = "3", default-features = false }
# The formula lexer's property tests (engine/formula, dev only): it shrinks
# a failing string to a short one. No default features: `fork` and
# `timeout` bring rusty-fork and wait-timeout, `regex-syntax` the regex
# strategies, and the tests build their strings from a list of characters.
proptest = { version = "1", default-features = false, features = ["std"] }
# Each crate's error enum (docs/guidelines.md § Rust code rules).
thiserror = "2"
# The Node.js addon's N-API glue (engine/napi, behind its `shim` feature):
# Node.js has no FFI on the lines the JS SDK supports, so it cannot load the
# C ABI library the way the other SDKs do and needs a native addon. `napi`
# keeps its default features: without them the addon links and loads but
# `require()` fails with "Module did not self-register".
napi = "3"
napi-derive = "3"
napi-build = "2"
# The writer of the large workbooks `make fixtures:generate` writes into
# fixtures/generated/ (engine/fixtures-gen, which is not published): a
# writer other than xlsx-graft, so that the reader can be checked against
# workbooks the xlsx-graft writer did not write. No default features;
# `constant_memory` writes each row to a temporary file as it is written,
# so a million rows take no more memory than ten, and brings tempfile with
# its default features (getrandom, which seeds the temporary file names).
# rust_xlsxwriter also brings zip, and every other crate this adds to the
# lockfile comes from zip: its `deflate` feature brings flate2 over zlib-rs
# and zopfli (with bumpalo, log and simd-adler32); zip itself always brings
# constant_time_eq, indexmap (with hashbrown and equivalent), typed-path
# and zeroize, whose zeroize_derive brings a second syn 2; on macOS and
# the BSDs it brings nix (with cfg_aliases), and on wasm targets getrandom
# brings js-sys and the wasm-bindgen crates. Only engine/fixtures-gen
# depends on rust_xlsxwriter, so none of these reaches a published crate.
rust_xlsxwriter = { version = "0.102", default-features = false, features = [
    "constant_memory",
] }

# Every lint below fails `make engine:verify`: the "warn" ones through clippy
# -D warnings, unsafe_code by itself ("deny"). The rules: docs/guidelines.md.
# Each member opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
# Anti-bloat gate (pairs with scripts/check-line-budget.sh): a function
# past the clippy.toml threshold fails `clippy -D warnings`, not review.
too_many_lines = "warn"
# A split module is `foo.rs` + `foo/<concern>.rs`; `foo/mod.rs` is refused.
mod_module_files = "warn"
# Every workbook is untrusted input: library code returns an error or a
# diagnostic instead of panicking. Tests are exempt (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# A stub never lands, not even in a test.
todo = "warn"
unimplemented = "warn"
# Every silenced lint says why, in the attribute itself:
# #[allow(clippy::x, reason = "...")].
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
# cargo-llvm-cov builds with --cfg coverage; declare it so
# `unexpected_cfgs` stays clean under clippy -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
# The engine is served to SDKs, a CLI and MCP: every item a crate exports
# says what it is.
missing_docs = "warn"
# A crate that needs raw pointers (the C ABI host, and the Node.js addon
# that calls it) allows it at its own root, under the rules in
# docs/guidelines.md § unsafe.
unsafe_code = "deny"

# Tuned for disk rather than debugger use: workspace crates keep line tables,
# so panic locations and backtraces still name our files; third-party crates
# carry none. Incremental is off: gates build once per change rather than in an
# edit-compile loop, so its caches in engine/target only add size.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
