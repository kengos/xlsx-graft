[workspace]
resolver = "3"
members = [
    "core",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause"
# Nothing is published until the release work decides the first version.
publish = false
repository = "https://github.com/kengos/xlsx-graft"

# Every lint below fails `make engine:verify`: the "warn" ones through clippy
# -D warnings, unsafe_code by itself ("deny"). The rules: docs/guidelines.md.
# Each member opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
# Anti-bloat gate (pairs with scripts/check-line-budget.sh): a function
# past the clippy.toml threshold fails `clippy -D warnings`, not review.
too_many_lines = "warn"
# A split module is `foo.rs` + `foo/<concern>.rs`; `foo/mod.rs` is refused.
mod_module_files = "warn"
# Every workbook is untrusted input: library code returns an error or a
# diagnostic instead of panicking. Tests are exempt (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# A stub never lands, not even in a test.
todo = "warn"
unimplemented = "warn"
# Every silenced lint says why, in the attribute itself:
# #[allow(clippy::x, reason = "...")].
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
# cargo-llvm-cov builds with --cfg coverage; declare it so
# `unexpected_cfgs` stays clean under clippy -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
# The engine is served to SDKs, a CLI and MCP: every item a crate exports
# says what it is.
missing_docs = "warn"
# A crate that needs raw pointers (the C ABI host) allows it at its own root,
# under the rules in docs/guidelines.md § unsafe.
unsafe_code = "deny"

# Tuned for disk rather than debugger use: workspace crates keep line tables,
# so panic locations and backtraces still name our files; third-party crates
# carry none. Incremental is off: gates build once per change rather than in an
# edit-compile loop, so its caches in engine/target only add size.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
