[package]
name = "xlsx-graft-style"
description = "xlsx-graft style: the values of a cell's style (font, fill, border, number format, alignment, protection), and how the styles part of a workbook holds and writes them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The error enum (docs/guidelines.md § Rust code rules).
thiserror = { workspace = true }
# The diagnostics of a styles part that is refused (StyleError::Invalid).
xlsx-graft-diagnostics = { workspace = true }
# `PartRewriter` and `WriteError`: a `StylesEdit` is a part rewriter that
# `PackageEdit::replace` takes (src/edit/part.rs).
xlsx-graft-write = { workspace = true }
# Reads the styles part under limits, and rewrites it keeping what it does
# not change.
xlsx-graft-xml = { workspace = true }

[dev-dependencies]
# Random styles for the property tests (src/tests/properties.rs).
proptest = { workspace = true }
# The package the read-back test opens.
xlsx-graft-package = { workspace = true }
# Reads the number formats this crate writes back (src/tests/read_back.rs).
xlsx-graft-read = { workspace = true }
# Holds the new content of the zip the read-back test writes.
xlsx-graft-spool = { workspace = true }

[lints]
workspace = true
