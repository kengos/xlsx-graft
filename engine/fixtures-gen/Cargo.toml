[package]
name = "xlsx-graft-fixtures-gen"
description = "Writes the large workbooks (rows and shared strings) `make fixtures:generate` puts in fixtures/generated/, the workbooks of fixtures/ written again by the engine (`make fixtures:repack`), and workbooks of cell values written by the engine (`make fixtures:cells`)"
version.workspace = true
edition.workspace = true
license.workspace = true
# A tool for this repository's tests and benchmarks, never published.
publish = false
repository.workspace = true

[[bin]]
name = "xlsx-graft-fixtures-gen"
path = "src/main.rs"

[dependencies]
# Writes each workbook, a row at a time (`constant_memory`, and low memory
# mode for the shared strings workbook).
rust_xlsxwriter = { workspace = true }
# FixturesGenError.
thiserror = { workspace = true }
# `cells` writes workbooks of cell values: each value as its `<c>` element,
# and the shared strings part (engine/cell).
xlsx-graft-cell = { workspace = true }
# `repack` writes each workbook of fixtures/ again with the engine's writer,
# to see whether Excel opens what it writes: the package it reads, the
# edit that rewrites one part, the scratch files that edit spills to, and
# the diagnostics a workbook that cannot be repacked reports. `cells` also
# uses the zip writer and the in-memory scratch storage of this list.
xlsx-graft-diagnostics = { workspace = true }
xlsx-graft-package = { workspace = true }
xlsx-graft-spool = { workspace = true }
xlsx-graft-write = { workspace = true }
xlsx-graft-xml = { workspace = true }

[dev-dependencies]
# The property tests of tests/names: any name the writer's rules accept is
# one the verifier reports no problem with.
proptest = { workspace = true }
# Each test writes its workbooks into a directory of its own.
tempfile = { workspace = true }
# The tests read each workbook written back with the engine's reader.
xlsx-graft-read = { workspace = true }
# The verifier that checks the names the writer's rules accept. It is here
# and not in xlsx-graft-write's tests because crates.txt publishes the
# writer before the verifier, and a dependency, a dev-dependency too, must
# come first.
xlsx-graft-verify = { workspace = true }

[lints]
workspace = true
