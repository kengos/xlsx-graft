[package]
name = "xlsx-graft-verify"
description = "xlsx-graft verify: refuses what an untrusted workbook may not carry (macros, external links, DDE, OLE, ActiveX, data connections, Web publishing), each part judged against the engine's defaults, the template's allow lists and the host's forbids, and finds what Excel repairs as it opens it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
# Which versions of the applications a template targets lack each
# function a formula calls.
xlsx-graft-compat = { workspace = true }
# Every problem in the workbook is returned as a Diagnostic.
xlsx-graft-diagnostics = { workspace = true }
# Reads each formula into the facts it states, which are judged here.
xlsx-graft-formula = { workspace = true }
# The package the parts, their media types and relationships are read from.
xlsx-graft-package = { workspace = true }
# The workbook part's sheets, in order, which a defined name's
# `localSheetId` counts, and the styles' cell formats a cell refers to.
xlsx-graft-read = { workspace = true }
# Reads each XML part as a stream, looking for the elements that carry a
# denied kind of content.
xlsx-graft-xml = { workspace = true }

[dev-dependencies]
# The CRC-32 of each entry of the zips the tests build.
crc32fast = { workspace = true }
# The scratch storage `Book::open` takes, for the tests that read the
# workbooks in the repository's fixtures/ folder (tests/fixtures).
xlsx-graft-spool = { workspace = true }
# The arguments of each diagnostic, as the JSON the engine reports, in the
# lines the tests in tests/fixtures compare.
serde_json = { workspace = true }

[lints]
workspace = true
