[package]
name = "xlsx-graft-cli"
description = "xlsx-graft CLI: the engine on the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "xlsx-graft"
path = "src/main.rs"

[dependencies]
# Parses the command line; `--format` is a global flag on the parser.
clap = { workspace = true }
# `--format json`: every output type derives Serialize and is printed by
# serde_json.
serde = { workspace = true }
serde_json = { workspace = true }
# CliError.
thiserror = { workspace = true }
xlsx-graft-core = { workspace = true }
# `read`: the problems found, printed as the JSON every host prints.
xlsx-graft-diagnostics = { workspace = true }
# `read`: the package's limits.
xlsx-graft-package = { workspace = true }
# `read`: a workbook and its rows.
xlsx-graft-read = { workspace = true }
# `read`: a large shared strings table spills to a temporary file.
xlsx-graft-spool = { workspace = true }

[dev-dependencies]
# The CRC-32 of each entry of the zips the tests build.
crc32fast = { workspace = true }
# A directory of its own for the workbooks each test writes.
tempfile = { workspace = true }

[lints]
workspace = true
