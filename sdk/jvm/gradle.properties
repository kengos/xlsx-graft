# Tracks the engine workspace's version (engine/Cargo.toml) while everything
# is pre-1.0; a test checks it.
version=0.0.0

# A gate run is one build in a fresh container: no daemon to keep, and plain
# output for the log.
org.gradle.daemon=false
org.gradle.console=plain
org.gradle.welcome=never
# A deprecation is a failure, as a warning is in the engine's clippy.
org.gradle.warning.mode=fail
# The build uses the JDKs the image holds and never downloads one.
org.gradle.java.installations.auto-download=false
