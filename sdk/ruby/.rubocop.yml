plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

# Double quotes everywhere, as on the Rust side: one quoting habit across the
# repository rather than each language's default.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 100

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# Assertions about one result stay in one example rather than one example per
# assertion, which would make the same FFI call again for each.
RSpec/MultipleExpectations:
  Max: 5
