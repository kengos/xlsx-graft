name: CI

# CI runs what `make verify` runs locally, in the same pinned toolchain image:
# the engine and every SDK on every line it supports. It runs `make verify`'s
# members as parallel jobs, which `make ci:matrix` lists, so a new SDK line
# needs no edit here. CI keeps no copy of the cargo flags, the coverage
# threshold, the image pin or the supported lines: a gate changes in the
# Makefile, and local and CI move together.
#
# No paths-ignore. Once a green run is required on main, a pull request that
# skipped the workflow would wait for a check that never reports, so a
# docs-only change runs the whole bar too.
on:
  push:
    branches: [main]
  pull_request:
  # Re-runs the bar without a new commit: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# A newer push to a pull request supersedes the run in flight: nobody acts on
# the older commit's result. Every other run is a group of its own, so no run
# on main is cancelled or dropped from the queue: each commit there is
# history, and saves the cache the pull requests restore.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# No packages: read and no registry login: the toolchain image is public, and
# the gates pull it anonymously, as they do on a contributor's machine.
permissions:
  contents: read

# Every gate prints one PASS/FAIL line and keeps its log under .make-logs/,
# which the runner throws away. V=1 streams the raw output into the job log
# instead.
env:
  V: 1

jobs:
  # Checks nothing: it prints `make verify`'s members as JSON for the gate
  # job's matrix, and needs no Docker. A broken Makefile fails it here rather
  # than in the gate job's fromJSON.
  matrix:
    name: make ci:matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: matrix
        run: |
          matrix=$(make --no-print-directory ci:matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One job per member of `make verify`, each the make target a contributor
  # runs. Linux only: the gates need Docker running Linux containers, which
  # the hosted macOS and Windows runners do not provide. fail-fast is off, so
  # one red line still shows how every other line fares.
  gate:
    name: make ${{ matrix.target }}${{ matrix.args && format(' {0}', matrix.args) || '' }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/engine-cache
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}

  # The check main's ruleset requires, under the name it has always had. It
  # passes only when the matrix was listed and every job of it passed. Without
  # `always()` a red gate would skip this job, and a skipped required check
  # counts as passed. A run cancelled by a newer push leaves it red, which
  # nobody acts on.
  verify:
    name: make verify
    needs: [matrix, gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          MATRIX: ${{ needs.matrix.result }}
          GATE: ${{ needs.gate.result }}
        run: |
          echo "make ci:matrix: $MATRIX, gates: $GATE"
          [ "$MATRIX" = success ] && [ "$GATE" = success ]
