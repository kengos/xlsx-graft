name: CI

# The one job runs `make verify`, the target a contributor runs locally, in
# the same pinned toolchain image. CI keeps no copy of the cargo flags, the
# coverage threshold or the image pin: a gate changes in the Makefile, and
# local and CI move together.
#
# No paths-ignore. Once a green run is required on main, a pull request that
# skipped the workflow would wait for a check that never reports, so a
# docs-only change runs the whole bar too.
on:
  push:
    branches: [main]
  pull_request:
  # Re-runs the bar without a new commit: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# A newer push to a pull request supersedes the run in flight: nobody acts on
# the older commit's result. Every other run is a group of its own, so no run
# on main is cancelled or dropped from the queue: each commit there is
# history, and saves the cache the pull requests restore.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# No packages: read and no registry login: the toolchain image is public, and
# the gates pull it anonymously, as they do on a contributor's machine.
permissions:
  contents: read

# Every gate prints one PASS/FAIL line and keeps its log under .make-logs/,
# which the runner throws away. V=1 streams the raw output into the job log
# instead.
env:
  V: 1

jobs:
  verify:
    # One job rather than one per member: the members share engine/target, so
    # separate jobs would each compile the workspace from their own cache.
    # Linux only: the gates need Docker running Linux containers, which the
    # hosted macOS and Windows runners do not provide.
    name: make verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/engine-cache
        with:
          target: verify
