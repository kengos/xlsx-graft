name: Run a make gate with a warm engine/target
description: >
  Runs one `make` target, the one a contributor runs, with engine/target
  restored from the cache before it and saved after it. The toolchain
  container writes as root, so the action hands engine/target back to the
  runner between the run and the save.

inputs:
  target:
    description: The make target to run, e.g. "verify".
    required: true
  args:
    description: >
      Variable assignments passed to make after the target, on one line and
      split on whitespace, e.g. "RUBY_VER=3.4".
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The build depends on the lockfile and on the toolchain, so the key holds
    # both: a new TOOLCHAIN_DIGEST starts from an empty engine/target instead
    # of one compiled by the previous rustc. The digest is read from the
    # Makefile, the file the gates read it from. Each target builds a part of
    # its own (engine:verify the debug and coverage builds, an SDK the release
    # library), so each keeps entries of its own; the lines of one SDK share
    # theirs, as `args` is not in the key.
    - name: Compute the cache key
      id: key
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        digest=$(sed -n 's/^TOOLCHAIN_DIGEST *:= *sha256:\([0-9a-f]*\)$/\1/p' Makefile)
        if [ -z "$digest" ]; then
          echo "engine-cache: no TOOLCHAIN_DIGEST in the Makefile" >&2
          exit 1
        fi
        echo "prefix=engine-target-${{ runner.os }}-$digest-${TARGET//:/-}-" >> "$GITHUB_OUTPUT"
        echo "lock=${{ hashFiles('engine/Cargo.lock') }}-" >> "$GITHUB_OUTPUT"

    # Each saved commit has its own entry, and the newest build of the same
    # lockfile is the one restored. A lockfile change restores nothing rather
    # than an entry built against other dependencies, whose artifacts would be
    # carried along and grow every later entry. What a hit saves is the
    # dependencies: the checkout gives every source file a new mtime, so
    # cargo rebuilds the workspace's own crates on every run.
    - uses: actions/cache/restore@v6
      id: restore
      with:
        path: engine/target
        key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.lock }}${{ github.sha }}
        restore-keys: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.lock }}

    # Only engine/target is cached. Cargo's download cache stays in the named
    # volume of a fresh runner: the workspace locks a couple of dozen crates,
    # which download in seconds.
    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
        ARGS: ${{ inputs.args }}
      run: |
        read -r -a args <<< "$ARGS"
        make "$TARGET" "${args[@]}"

    # Everything the container wrote is root-owned. Handing it back keeps the
    # save, and any later step that writes engine/target, from depending on
    # the modes the container happened to create.
    - name: Hand engine/target back to the runner
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        if [ -d engine/target ]; then
          sudo chown -R "$(id -u):$(id -g)" engine/target
        fi

    # main saves every commit: its entries are the ones every pull request can
    # restore. A pull request's entries are visible to that pull request only,
    # so it saves once, when it restored nothing (a new toolchain digest or a
    # lockfile main has not built yet), rather than spending the repository's
    # cache limit on every push and evicting main's. A re-run that hit its
    # exact key saves nothing, since an entry is never overwritten; neither
    # do the lines of one SDK after the first to save, which race for the same
    # key and leave a warning. A failed gate still saves: what compiled is worth
    # reusing.
    - uses: actions/cache/save@v6
      if: >-
        ${{ !cancelled() && steps.restore.outcome == 'success'
        && steps.restore.outputs.cache-hit != 'true'
        && (github.ref == 'refs/heads/main' || steps.restore.outputs.cache-matched-key == '') }}
      with:
        path: engine/target
        key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.lock }}${{ github.sha }}
